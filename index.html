<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basquiat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Chivo+Mono:wght@400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <canvas id="tv-noise" aria-hidden="true"></canvas>
  <section id="tunnel-stage">
    <section class="line-space" inert id="line-space" aria-label="Espacio inmersivo tridimensional" lang="es">
      <div class="space-viewport">
        <canvas id="space-canvas" tabindex="0"
          aria-label="Vista de cámara en un espacio de líneas. Desplázate para entrar, arrastra o usa las flechas para mirar, más y menos para acercarte, e Inicio para centrar la vista."></canvas>
      </div>
    </section>
    <img id="tunnel-door" src="assets/img/camera-door-4x-transparent.png" alt="">
    <div class="tunnel-memories" aria-hidden="true">
      <img class="tunnel-memory memory-01" src="assets/img/tunnel-01-cassette-.png" alt="">
      <img class="tunnel-memory memory-02" src="assets/img/tunnel-02-walkman-.png" alt="">
      <img class="tunnel-memory memory-03" src="assets/img/tunnel-03-ipod.png" alt="">
      <img class="tunnel-memory memory-04" src="assets/img/tunnel-04-crt-tv.png" alt="">
      <img class="tunnel-memory memory-05" src="assets/img/tunnel-05-smartphone.png" alt="">
    </div>
    <section id="hero-wrapper">
      <div id="hero-scene">
        <p class="top-label">The new abnormal experience</p>
        <div class="floor">
          <img class="yellow" src="assets/svg/YELLOWhome.svg" alt="">
          <img class="black" src="assets/svg/BLACKhome.svg" alt="">
          <img class="lightblue" src="assets/svg/LIGHT BLUEhome.svg" alt="">
          <img class="pink" src="assets/svg/pinkhome.svg" alt="">
          <img class="darkblue" src="assets/svg/DARK BLUEhome.svg" alt="">
          <img class="floor-img" src="assets/img/home-floor.png" alt="">
          <img class="door-img" src="assets/img/home-door.png" alt="">
        </div>
        <div class="hero">
          <h1>Life get's a little<br>weirder everytime</h1>
          <p>Can you feel it?</p>
        </div>
      </div>
    </section>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="main.js"></script>
  <script src="space.js"></script>
  <script src="noise.js"></script>
</body>

</html>
